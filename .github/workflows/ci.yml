name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HUSKY: '0'
      TEST_DATABASE_URL: postgresql://chirp:chirp@localhost:5432/chirp_test
    services:
      postgres:
        # Same image as docker-compose.yml.
        image: postgres:16.16-alpine
        env:
          POSTGRES_USER: chirp
          POSTGRES_PASSWORD: chirp
          POSTGRES_DB: chirp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chirp -d chirp_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (lint, format, typecheck, tests with coverage)
        run: npm run verify

      - name: Publish coverage summary
        if: ${{ !cancelled() }}
        run: node .github/scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HUSKY: '0'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same docker-compose services as local development: init.sql creates chirp_test and
      # storage-init creates the bucket the seed uploads avatars to. They start now and boot
      # while dependencies install; the ports match the defaults in apps/web/e2e/stack.ts.
      - name: Start PostgreSQL and storage
        run: docker compose up -d db storage

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./apps/web/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # System libraries are not in the cache.
      - name: Install Chromium system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: apps/web

      # Over TCP on purpose: while init.sql runs, PostgreSQL accepts only socket connections,
      # so the image's own health check can pass before chirp_test exists.
      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 60); do
            docker compose exec -T db pg_isready -h localhost -U chirp -d chirp_test && exit 0
            sleep 1
          done
          docker compose logs db
          exit 1

      - name: Create the storage bucket
        run: docker compose run --rm storage-init

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      - name: Show service logs
        if: failure()
        run: docker compose logs
