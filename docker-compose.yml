# Local infrastructure for Chirp.
#   Development:  npm run services:up   (db + storage + bucket setup)
#   Full stack:   docker compose up --build   → http://localhost:8080 (adds api + web)
#   Credentials and ports default to development values; override them in .env.
#   The project name comes from COMPOSE_PROJECT_NAME (.env) or the folder name; the
#   top-level `name:` key is avoided for compatibility with Docker Compose v2.0.

services:
  db:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chirp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chirp}
      POSTGRES_DB: ${POSTGRES_DB:-chirp}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs only when the data volume is first created.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-create-test-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage (RustFS). Production would point the API at S3 instead.
  storage:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ROOT_USER:-chirp}
      RUSTFS_SECRET_KEY: ${STORAGE_ROOT_PASSWORD:-chirpsecret}
    ports:
      - '${STORAGE_PORT:-9000}:9000' # S3 API
      - '${STORAGE_CONSOLE_PORT:-9001}:9001' # web console
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/health']
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot job: creates the media bucket with public read and browser CORS, then exits.
  storage-init:
    image: amazon/aws-cli:2.42.0
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ROOT_USER:-chirp}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_ROOT_PASSWORD:-chirpsecret}
      AWS_DEFAULT_REGION: us-east-1
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_BUCKET: ${STORAGE_BUCKET:-chirp-media}
      STORAGE_CORS_ORIGINS: ${STORAGE_CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    entrypoint: ['/bin/sh', '/storage/init.sh']
    volumes:
      - ./docker/storage:/storage:ro
    restart: 'no'

  # Production image of the API. Only `docker compose up` starts it; services:up does not.
  # Its variables are set here rather than read from .env, whose addresses are for the host.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: 'false'
      DATABASE_URL: postgresql://${POSTGRES_USER:-chirp}:${POSTGRES_PASSWORD:-chirp}@db:5432/${POSTGRES_DB:-chirp}
      WEB_ORIGINS: http://localhost:${WEB_PORT:-8080}
      # Requests arrive through nginx (`web`), which forwards the client address.
      TRUST_PROXY: 'true'
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_ENDPOINT: http://localhost:${STORAGE_PORT:-9000}
      S3_BUCKET: ${STORAGE_BUCKET:-chirp-media}
      S3_ACCESS_KEY_ID: ${STORAGE_ROOT_USER:-chirp}
      S3_SECRET_ACCESS_KEY: ${STORAGE_ROOT_PASSWORD:-chirpsecret}
      # Demo data on the first start of this local stack; the image alone never seeds (ADR-23).
      SEED_DEMO_DATA: 'true'
    # No published port: the browser reaches the API through `web` (single origin, ADR-17).
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  # Production image of the web app: nginx serves the SPA and proxies /api to `api`.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      STORAGE_PUBLIC_ORIGIN: http://localhost:${STORAGE_PORT:-9000}
    ports:
      - '${WEB_PORT:-8080}:8080'
    restart: unless-stopped

volumes:
  db-data:
  storage-data:
